# Production stack: the Next.js app, and the tools agents can use.
#
# Host networking for the app, because Ollama on the server listens on
# 127.0.0.1 only, and users' own Ollama servers on the LAN are reached the same
# way as bare metal. The app listens on WEB_PORT (default 3000) on every interface.
#
# Host state is bind-mounted, so the SQLite database stays a plain file on the
# host (./data/llmlynx.db) that backups can copy. The image runs as uid 1000,
# which owns these directories on the server. Secrets come from the gitignored
# .env and .env.local at runtime and are never baked into the image.
#
# The agent tools (web search, page reading, screenshots, files, running code)
# and the security layer's two scanners (prompt injections and viruses, see
# docs/security.md) are part of the app: they always run. The web tools share
# the private "tools" network; only the MCP servers and clamd are published, on
# 127.0.0.1, where the app reaches them. Their tokens must be in .env (not
# .env.local): compose fills ${...} from .env only. npm install and every
# deploy put them there (scripts/setup-env.mjs). The guard downloads its model
# when its image is built (about 300 MB).
name: llmlynx

services:
  web:
    image: llmlynx-web
    build: .
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      # Override the dev-machine values from the env files.
      DATABASE_URL: file:/app/data/llmlynx.db
      AUTH_LOG_DIR: /app/logs
      PORT: ${WEB_PORT:-3000}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${LOGS_DIR:-./logs}:/app/logs
    network_mode: host
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    init: true
    restart: unless-stopped

  # Metasearch engine behind web_search. Not published: only mcp-searxng uses it.
  searxng:
    image: searxng/searxng:2026.11.2-cccbc9e15
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_BASE_URL: http://searxng:8080/
      # settings.yml is mounted read-only
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./tools/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    networks: [tools]
    restart: unless-stopped

  # MCP server for web_search and web_read (https://github.com/ihor-sokoliuk/mcp-searxng).
  # Its URL reader blocks private and LAN addresses itself.
  mcp-searxng:
    image: isokoliuk/mcp-searxng:2.10.0
    environment:
      SEARXNG_URL: http://searxng:8080
      MCP_HTTP_PORT: "8080"
      # Inside the container; the host side is 127.0.0.1 only
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_HARDEN: "true"
      MCP_HTTP_AUTH_TOKEN: ${SEARCH_MCP_TOKEN:-}
      MCP_HTTP_STATELESS: "true"
      # The Host header the app sends, port included
      MCP_HTTP_ALLOWED_HOSTS: 127.0.0.1:${SEARCH_MCP_PORT:-8790},localhost:${SEARCH_MCP_PORT:-8790}
      MCP_HTTP_ALLOWED_ORIGINS: http://127.0.0.1,http://localhost
      # The app connects once per tool call (default: 20 per minute); it limits users itself
      MCP_RATE_INIT_MAX: "300"
    ports:
      - 127.0.0.1:${SEARCH_MCP_PORT:-8790}:8080
    depends_on: [searxng]
    networks: [tools]
    restart: unless-stopped

  # MCP server for web_read_rendered and web_screenshot (tools/browser):
  # headless Chromium, whose traffic all goes through the egress proxy.
  browser:
    image: llmlynx-browser
    build: ./tools/browser
    environment:
      MCP_AUTH_TOKEN: ${BROWSER_MCP_TOKEN:-}
      EGRESS_PROXY: http://egress:3128
      # The server also runs Ollama; one page at a time keeps memory in check
      BROWSER_MAX_CONCURRENCY: ${BROWSER_MAX_CONCURRENCY:-1}
    ports:
      - 127.0.0.1:${BROWSER_MCP_PORT:-8791}:8080
    # Docker's default profile plus the user namespaces Chromium's sandbox needs, so
    # Chromium keeps its sandbox. From Playwright (utils/docker/seccomp_profile.json, v1.64.1).
    security_opt:
      - seccomp=./tools/browser/seccomp_profile.json
    shm_size: 1gb
    mem_limit: 1536m
    init: true
    depends_on: [egress]
    networks: [tools]
    restart: unless-stopped

  # Egress proxy for the browser: refuses private, loopback and LAN addresses.
  egress:
    image: ubuntu/squid:6.6-24.04_edge
    volumes:
      - ./tools/egress/squid.conf:/etc/squid/squid.conf:ro
    networks: [tools]
    restart: unless-stopped

  # MCP server for the file tools and for reading attached files (tools/files).
  # Files come and go in the calls: it keeps nothing and fetches nothing, so
  # it runs read-only, on a network of its own.
  files:
    image: llmlynx-files
    build: ./tools/files
    environment:
      MCP_AUTH_TOKEN: ${FILES_MCP_TOKEN:-}
      # Files converted at once; each can take a few hundred MB
      FILES_MAX_CONCURRENCY: ${FILES_MAX_CONCURRENCY:-2}
      HOME: /tmp
    ports:
      - 127.0.0.1:${FILES_MCP_PORT:-8792}:8080
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    init: true
    networks: [files]
    restart: unless-stopped

  # MCP server for run_code, install_packages and git (tools/code): runs code
  # in bubblewrap jails without network, installs packages from PyPI and npm
  # per chat, and runs git on the chat's repositories. It keeps none of a
  # chat's files, only its installed packages, on a volume of their own. It
  # sits on an internal network that reaches nothing but code-egress, its only
  # way in (the app's calls) and out (installs, to PyPI and npm only; git's
  # downloads, over HTTPS to public addresses only), and clamd, which scans
  # what installs download.
  code:
    image: llmlynx-code
    build: ./tools/code
    environment:
      MCP_AUTH_TOKEN: ${CODE_MCP_TOKEN:?CODE_MCP_TOKEN is missing from .env. Run npm install or node scripts/setup-env.mjs to add it}
      # Runs and installs at once on the whole server; each run gets a CPU core of its own
      CODE_MAX_CONCURRENCY: ${CODE_MAX_CONCURRENCY:-2}
      # The memory of one run, in MB (see .env.example)
      CODE_RUN_MEMORY_MB: ${CODE_RUN_MEMORY_MB:-2048}
      # The limits of a chat's packages (see .env.example)
      CODE_PACKAGES_DOWNLOAD_GB: ${CODE_PACKAGES_DOWNLOAD_GB:-5}
      CODE_PACKAGES_INSTALLED_GB: ${CODE_PACKAGES_INSTALLED_GB:-10}
      CODE_PACKAGES_EXPIRE_DAYS: ${CODE_PACKAGES_EXPIRE_DAYS:-7}
      PACKAGES_PROXY: http://code-egress:3128
      GIT_PROXY: http://code-egress:3129
      CLAMAV_HOST: clamav
      HOME: /tmp
    volumes:
      - code-packages:/packages
    read_only: true
    # The runs' folders while they run
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    # Docker's default profile plus user namespaces and mounts inside them,
    # which bubblewrap needs to make its jails (tools/code/seccomp_profile.json).
    # Each jail mounts a /proc of its own, which most kernels refuse while
    # Docker hides parts of the container's /proc: systempaths=unconfined
    # leaves them visible (the server runs without capabilities and root's
    # files there stay root's).
    security_opt:
      - no-new-privileges:true
      - seccomp=./tools/code/seccomp_profile.json
      - systempaths=unconfined
    # Used only while code runs: CODE_MAX_CONCURRENCY runs of CODE_RUN_MEMORY_MB each, and the server
    mem_limit: ${CODE_CONTAINER_MEMORY_MB:-4608}m
    init: true
    networks: [code]
    restart: unless-stopped

  # The code container's only way in and out (tools/code/egress.conf): it
  # passes the app's calls on to it, lets installs reach PyPI and the npm
  # registry over HTTPS, and git's downloads reach public addresses over
  # HTTPS, and nothing else.
  code-egress:
    image: ubuntu/squid:6.6-24.04_edge
    volumes:
      - ./tools/code/egress.conf:/etc/squid/squid.conf:ro
    ports:
      - 127.0.0.1:${CODE_MCP_PORT:-8794}:8794
    # Names that point to the host and the LAN, as a public name can: squid must refuse them as it refuses
    # those addresses. For the live tests (src/server/sandbox/live.test.ts), without depending on outside DNS.
    extra_hosts:
      - loopback.test:127.0.0.1
      - lan.test:192.168.1.10
    # Not depends_on code: recreating code would stop it. It finds code again by itself.
    networks: [code, code-egress]
    restart: unless-stopped

  # MCP server that scans text for prompt injections (tools/guard), with Llama
  # Prompt Guard 2 on the CPU. The app calls it for web content and attached
  # files; it is not a tool of the models. The text comes in the call: it keeps
  # nothing and fetches nothing, so it runs read-only, on a network of its own.
  guard:
    image: llmlynx-guard
    build:
      context: ./tools/guard
      args:
        # 22m (the default) or 86m: the image holds exactly one model
        GUARD_MODEL: ${GUARD_MODEL:-22m}
    environment:
      MCP_AUTH_TOKEN: ${GUARD_MCP_TOKEN:?GUARD_MCP_TOKEN is missing from .env. Run npm install or node scripts/setup-env.mjs to add it}
      GUARD_THRESHOLD: ${GUARD_THRESHOLD:-0.5}
      # One batch of text at a time: the model uses every core
      GUARD_MAX_CONCURRENCY: ${GUARD_MAX_CONCURRENCY:-1}
    ports:
      - 127.0.0.1:${GUARD_MCP_PORT:-8793}:8080
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    init: true
    networks: [guard]
    restart: unless-stopped

  # ClamAV: clamd scans attached files and web content for malware, and
  # freshclam keeps its signatures up to date. That update is the only thing
  # the security layer gets from the internet, so the service has a network of
  # its own. clamd has no authentication: it is published on 127.0.0.1 only.
  # The official clamav/clamav image has no linux/arm64 build; this one has.
  clamav:
    image: clamav/clamav-debian:1.5.4
    volumes:
      - ./tools/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav-db:/var/lib/clamav
    ports:
      - 127.0.0.1:${CLAMAV_PORT:-3310}:3310
    cap_drop: [ALL]
    # What the image's start script needs: it gives its directories to the
    # clamav user, lets freshclam write there, and both then drop to that user
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    # clamd holds about 1 GB of signatures in memory
    mem_limit: 2g
    # Its own network, for the signature updates, and the code container's, to scan what installs download
    networks: [clamav, code]
    restart: unless-stopped

networks:
  tools: {}
  files: {}
  guard: {}
  clamav: {}
  # No route out: the code container reaches code-egress and clamd, and nothing else
  code:
    internal: true
  code-egress: {}

volumes:
  searxng-cache: {}
  # The virus signatures, so a restart does not download them again
  clamav-db: {}
  # The chats' installed packages and the shared cache of what passed the scan (tools/code)
  code-packages: {}
