# clamd, the virus scanner of llmlynx's security layer (see docker-compose.yml,
# service clamav, and src/server/security/clamd.ts). The app sends it attached
# files and web content over TCP; the port is published on 127.0.0.1 only.

# The log goes to the container's output: docker compose logs clamav
LogTime yes
# The image's start script waits for this socket, and freshclam tells clamd about new signatures over it
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# A signature update would by default load the new database beside the old
# one, and so need twice the roughly 1.2 GB the signatures take. Scans wait
# during a reload instead.
ConcurrentDatabaseReload no

# The largest stream clamd takes: 2 GB, the most ClamAV can scan. Installs of
# packages send each unpacked file on its own (tools/code/src/packages.py); the
# app sends files of up to 20 MB, and the git tool a command's files as one archive
StreamMaxLength 2000M
# So that such a file is scanned whole, also what is in it when it is an archive
MaxFileSize 2000M
MaxScanSize 4000M
# Packages bundle archives (Java .jar files) with more files than the default 10,000
MaxFiles 100000
# How long one scan may take, in ms (default 2 minutes): a 2 GB file on the Pi
# (tools/code/src/clamd.py waits a little longer). The app gives up on its own scans sooner
MaxScanTime 1200000
# A file that goes past one of these limits is reported as
# Heuristics.Limits.Exceeded.<limit> instead of as clean: the app and the code
# container count it as not checked, so it is withheld or not installed
AlertExceedsMax yes
